name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # id-token: write is what lets this job request the OIDC token AWS
    # uses to hand back short-lived credentials -- scoped to just this
    # job, not the whole workflow, since it's the only one that needs it.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # npm 12 (July 2026) blocks dependency install scripts by default
      # unless the exact resolved version is listed in package.json's
      # allowScripts -- pinned explicitly here so this always matches
      # local dev behaviour, rather than depending on whatever npm
      # version happens to ship with the runner's cached Node image.
      - name: Ensure npm 12+
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Role ARN, bucket name, and distribution ID are identifiers, not
      # secrets -- safe to commit directly, no repo secrets needed at all.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::249994635027:role/hopecc-website-github-actions-deploy
          aws-region: eu-west-2

      - name: Sync build to S3
        run: aws s3 sync dist/ s3://hopecc-website-249994635027 --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E26BTS9MBN5LNH --paths "/*"

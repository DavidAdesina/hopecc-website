<!doctype html>
<!--
  Decap CMS admin screen — this is what maintainers open at /admin to edit
  the church website's content without touching code.

  IMPORTANT (see README.md "Decap CMS login works on the live site" for
  full detail):
  This screen only loads the CMS UI. Logging in and saving changes use
  GitHub OAuth, provided by the Lambda-based OAuth proxy behind API Gateway
  (live since Session 4 — config.yml's `backend.base_url` points at it).

  For testing the CMS locally without GitHub, see the "Testing Decap
  locally" note in config.yml.

  SCRIPT PINNING (added Day 6b hardening pass — see README.md):
  This used to load decap-cms@^3.0.0, which let unpkg serve whatever the
  newest matching release was on every page load — no version control and
  no check that the file hadn't been tampered with in transit or on
  unpkg's end. It's now pinned to an exact version (3.15.1) with a
  Subresource Integrity hash, so the browser refuses to run the script if
  the bytes it receives don't match exactly what was verified below.

  This will NOT auto-update anymore — that's the point, but it means
  someone has to deliberately bump both the version number and the hash
  periodically. See README.md "/admin script pinning" for how.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Hope Community Church</title>
  </head>
  <body>
    <script
      src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"
      integrity="sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L"
      crossorigin="anonymous"
    ></script>
  </body>
</html>

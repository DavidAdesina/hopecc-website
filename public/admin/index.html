<!doctype html>
<!--
  Decap CMS admin screen — this is what maintainers open at /admin to edit
  the church website's content without touching code.

  IMPORTANT (see README.md "Decap CMS" section for full detail):

  requires GitHub OAuth, which is provided by the Lambda-based OAuth proxy
  planned for Phase 3 (Day 7+). Until that's deployed, this page is
  configured but not fully usable on the live site — see config.yml's
  `backend.base_url` for the placeholder that needs updating once the
  proxy exists.

  For local testing before Phase 3, see the "Testing Decap locally" note
  in config.yml.
-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
